<head>

  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d27;
      --card-border: #2e3446;
      --accent: #e5a93c;
      --accent-hover: #f0ba54;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #141722;
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo-area h1 {
      font-size: 1.25rem;
      color: var(--accent);
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo-area p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .bt-area {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background: #242938;
      border: 1px solid var(--card-border);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .status-dot.connected { background: var(--success); }
    .status-dot.busy { background: var(--accent); }

    button.btn-primary {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 0.5rem 1.1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.15s;
    }
    button.btn-primary:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      width: 100%;
      flex: 1;
    }

    /* Controls Bar */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (min-width: 768px) {
      .toolbar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.4rem 0.75rem;
      border-radius: 0.4rem;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #272c3d;
      color: var(--accent);
      border-color: var(--accent);
    }
    .search-input {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      border-radius: 0.4rem;
      font-size: 0.9rem;
      min-width: 240px;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.6rem;
      padding: 1rem;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card-thumb-wrap {
      width: 100%;
      height: 140px;
      background: #12151e;
      border-radius: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #232838;
    }
    .card-thumb {
      max-height: 120px;
      max-width: 120px;
      object-fit: contain;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
    }
    .badge {
      font-size: 0.65rem;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      font-weight: 600;
      text-transform: uppercase;
      background: #272d3f;
      color: var(--accent);
      white-space: nowrap;
    }
    .card-set {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .card-desc {
      font-size: 0.8rem;
      color: #9ca3af;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Modal / Print Preview */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: #181b26;
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      color: var(--accent);
      font-size: 1.15rem;
    }
    .modal-body {
      padding: 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
    }
    @media (min-width: 640px) {
      .modal-body {
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
      }
    }
    .preview-container {
      background: #fff;
      padding: 8px;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      max-width: 384px;
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }
    #ticketCanvas {
      display: block;
      width: 384px;
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
      background: #ffffff;
    }
    .modal-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }
    .progress-bar-wrap {
      width: 100%;
      background: #242938;
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
      margin-top: 0.5rem;
      display: none;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s linear;
    }
  </style>
</head>

    <div class="logo-area">

      </div>
      <input type="text" class="search-input" id="search" placeholder="🔍 Search across items, spells & heroes...">
    </div>

    <div class="grid" id="itemsGrid"></div>
  </main>

  <!-- Preview Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Item Preview</h3>
        <button class="filter-btn" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="preview-container">
          <canvas id="ticketCanvas" width="384" height="600"></canvas>
        </div>
        <div class="modal-details">
          <div>
            <h4 id="detailName" style="color: var(--accent); font-size: 1.25rem;"></h4>
            <p id="detailCategory" style="color: var(--text-muted); font-size: 0.85rem;"></p>
          </div>
          <div id="detailSetBox" style="background:#1e2333; padding:0.75rem; border-radius:0.4rem; border-left:3px solid var(--accent); display:none;">
            <strong style="color: var(--accent); font-size: 0.85rem;">★ Set Bonus:</strong>
            <p id="detailSetText" style="font-size: 0.85rem; margin-top:0.25rem;"></p>
          </div>
          <div>
            <strong style="font-size: 0.85rem;">Effect / Rules:</strong>
            <p id="detailDesc" style="font-size: 0.9rem; line-height:1.4; margin-top:0.35rem; color:#cbd5e1;"></p>
          </div>
          <div class="progress-bar-wrap" id="progressWrap">
            <div class="progress-bar-fill" id="progressFill"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="filter-btn" id="btnDownload">💾 Save PNG</button>
        <button class="btn-primary" id="btnPrint">🖨️ Print to Thermal Printer</button>
      </div>
    </div>
  </div>

    // Dallas Maxim CRC-8
    function crc8(bytes) {
      let crc = 0;
      for (let b of bytes) {
        crc ^= b;
        for (let i = 0; i < 8; i++) {
          crc = (crc & 0x80) ? ((crc << 1) ^ 0x07) & 0xFF : (crc << 1) & 0xFF;
        }
      }
      return crc;
    }

    function makeCommand(cmdId, payload = []) {
      const len = payload.length;
      const header = [0x22, 0x21, cmdId, 0x00, len & 0xFF, (len >> 8) & 0xFF, ...payload];
      const chk = crc8(payload);
      return new Uint8Array([...header, chk, 0xFF]);
    }

    // Web Bluetooth Connect
    async function connectPrinter() {
      try {
        statusText.textContent = "Pairing...";
        statusDot.className = "status-dot busy";

        const chkAll = document.getElementById("chkAllDevices");
        const showAll = chkAll && chkAll.checked;

        const requestOptions = showAll
          ? {
              acceptAllDevices: true,
              optionalServices: [SERVICE_UUID_1, SERVICE_UUID_2]
            }
          : {
              filters: [
                { services: [SERVICE_UUID_1] },
                { services: [SERVICE_UUID_2] },
                { namePrefix: "MX" },
                { namePrefix: "Fun" },
                { namePrefix: "Cat" },
                { namePrefix: "GB" }
              ],
              optionalServices: [SERVICE_UUID_1, SERVICE_UUID_2]
            };

        bleDevice = await navigator.bluetooth.requestDevice(requestOptions);

        bleDevice.addEventListener("gattserverdisconnected", onDisconnected);
        const server = await bleDevice.gatt.connect();

        let service = null;
        try {
          service = await server.getPrimaryService(SERVICE_UUID_1);
        } catch (e) {
          service = await server.getPrimaryService(SERVICE_UUID_2);
        }

        ctrlChar = await service.getCharacteristic(CHAR_CTRL);
        dataChar = await service.getCharacteristic(CHAR_DATA);

        statusText.textContent = `Connected (${bleDevice.name || "MXW01"})`;
        statusDot.className = "status-dot connected";
        btnConnect.textContent = "Disconnect";
      } catch (err) {
        console.error("Connection error:", err);
        statusText.textContent = "Disconnected";
        statusDot.className = "status-dot";
        if (err.name !== "NotFoundError") {
          alert("Bluetooth note: " + err.message);
        }
      }
    }

    // Helper: Word Wrap for Canvas
    function wrapTextCanvas(ctx, text, maxWidth) {
      const lines = [];
      for (let paragraph of text.split("\n")) {
        paragraph = paragraph.trim();
        if (!paragraph) { lines.push(""); continue; }
        const words = paragraph.split(" ");
        let line = "";
        for (let w of words) {
          const test = line ? (line + " " + w) : w;
          if (ctx.measureText(test).width <= maxWidth) {
            line = test;
          } else {
            if (line) lines.push(line);
            line = w;
          }
        }
        if (line) lines.push(line);
      }
      return lines;
    }

    // Draw Side Flourish
    function drawSideFlourish(ctx, cx, topY, botY) {
      const midY = Math.floor((topY + botY) / 2);
      ctx.lineWidth = 1;
      ctx.strokeStyle = "#000";
      ctx.fillStyle = "#000";

      // Spine
      ctx.beginPath();
      ctx.moveTo(cx, topY + 25);
      ctx.lineTo(cx, botY - 25);
      ctx.stroke();

      // Diamonds
      for (let y of [topY + 25, midY, botY - 25]) {
        ctx.beginPath();
        ctx.moveTo(cx, y - 7);
        ctx.lineTo(cx + 7, y);
        ctx.lineTo(cx, y + 7);
        ctx.lineTo(cx - 7, y);
        ctx.closePath();
        ctx.fill();
      }

      // Filigree arcs
      ctx.beginPath();
      ctx.arc(cx, midY - 28, 14, Math.PI, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, midY + 28, 14, 0, Math.PI);
      ctx.stroke();

      // Accent lines
      ctx.beginPath();
      ctx.moveTo(cx - 12, midY); ctx.lineTo(cx + 12, midY);
      ctx.moveTo(cx - 8, topY + 12); ctx.lineTo(cx + 8, topY + 12);
      ctx.moveTo(cx - 8, botY - 12); ctx.lineTo(cx + 8, botY - 12);
      ctx.stroke();
    }

    // Render Card onto 384px Canvas
    async function renderCardOnCanvas(item) {
      return new Promise((resolve) => {
        const artImg = new Image();

        const onImageReady = (loadedImg) => {
          const contentWidth = PRINTER_WIDTH - 36;
          const artW = 240;
          const artH = loadedImg ? Math.round((artW / loadedImg.width) * loadedImg.height) : 200;

          ctx.font = "21px sans-serif";
          const descLines = wrapTextCanvas(ctx, item.description, contentWidth);
          const setLines = item.set_bonus ? wrapTextCanvas(ctx, item.set_bonus, contentWidth - 32) : [];

          const titleLineH = 32;
          const bodyLineH = 30;
          const setLineH = 30;
          const setBoxH = setLines.length ? (42 + setLines.length * setLineH + 20) : 0;

          ctx.font = "bold 25px sans-serif";
          const titleLines = wrapTextCanvas(ctx, item.name.toUpperCase(), contentWidth);
          const titleBlockH = titleLines.length * titleLineH;
          const descBlockH = descLines.length * bodyLineH;

          // Generous layout without bottom reference
          const totalH = 12 + 46 + 14 + titleBlockH + 36 + 14 + artH + 26 + 32 + descBlockH + 18 + (setBoxH ? (setBoxH + 22) : 0) + 24 + 12;

          canvas.height = totalH;

          // Ensure 100% white background (no transparency)
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, PRINTER_WIDTH, totalH);

          // Outer Double Borders
          ctx.strokeStyle = "#000000";
          ctx.lineWidth = 3;
          ctx.strokeRect(6, 6, PRINTER_WIDTH - 12, totalH - 12);
          ctx.lineWidth = 1;
          ctx.strokeRect(11, 11, PRINTER_WIDTH - 22, totalH - 22);

          // Inverted Header Banner
          ctx.fillStyle = "#000000";
          ctx.fillRect(18, 18, PRINTER_WIDTH - 36, 44);
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 18px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("TINY EPIC DUNGEONS", PRINTER_WIDTH / 2, 46);

          // Title (Large, bold)
          ctx.fillStyle = "#000000";
          ctx.font = "bold 25px sans-serif";
          let curY = 76;
          for (let tl of titleLines) {
            ctx.fillText(tl, PRINTER_WIDTH / 2, curY + 22);
            curY += titleLineH;
          }

          // Slot Tag
          const tag = item.type === "Hero" ? `[ HERO: ${item.title ? item.title.toUpperCase() : "CHARACTER"} ]` : (item.type === "Spell" ? "[ SPELL CARD ]" : (item.set ? `[ ${item.type.toUpperCase()} ]  •  [ ${item.set.toUpperCase()} ]` : `[ ${item.type.toUpperCase()} ]  •  [ ${item.category.toUpperCase()} ]`));
          ctx.font = "bold 18px sans-serif";
          ctx.fillText(tag, PRINTER_WIDTH / 2, curY + 22);
          curY += 34;

          // Divider
          ctx.beginPath();
          ctx.lineWidth = 2;
          ctx.moveTo(18, curY); ctx.lineTo(PRINTER_WIDTH - 18, curY);
          ctx.stroke();
          curY += 12;

          // Centered Artwork
          const artX = Math.floor((PRINTER_WIDTH - artW) / 2);
          if (loadedImg) {
            ctx.drawImage(loadedImg, artX, curY, artW, artH);
          } else {
            ctx.fillStyle = "#f1f5f9";
            ctx.fillRect(artX, curY, artW, artH);
            ctx.fillStyle = "#000";
            ctx.font = "bold 16px sans-serif";
            ctx.fillText(item.name, PRINTER_WIDTH / 2, curY + artH / 2);
          }

          ctx.lineWidth = 2;
          ctx.strokeRect(artX - 3, curY - 3, artW + 6, artH + 6);
          ctx.lineWidth = 1;
          ctx.strokeRect(artX - 6, curY - 6, artW + 12, artH + 12);

          // Left & Right Flourishes
          drawSideFlourish(ctx, Math.floor(artX / 2), curY, curY + artH);
          drawSideFlourish(ctx, PRINTER_WIDTH - Math.floor(artX / 2), curY, curY + artH);

          curY += artH + 16;
          ctx.beginPath();
          ctx.lineWidth = 2;
          ctx.moveTo(18, curY); ctx.lineTo(PRINTER_WIDTH - 18, curY);
          ctx.stroke();
          curY += 16;

          // Effect header
          ctx.textAlign = "left";
          ctx.font = "bold 21px sans-serif";
          ctx.fillText("EFFECT:", 20, curY + 20);
          curY += 30;

          // Description lines
          ctx.font = "21px sans-serif";
          for (let dl of descLines) {
            ctx.fillText(dl, 20, curY + 20);
            curY += bodyLineH;
          }
          curY += 14;

          // Set Bonus Box with generous internal padding
          if (setLines.length) {
            const boxTop = curY;
            ctx.lineWidth = 2;
            ctx.strokeRect(18, boxTop, PRINTER_WIDTH - 36, setBoxH);
            ctx.font = "bold 21px sans-serif";
            ctx.fillText("★ SET BONUS:", 28, boxTop + 26);
            ctx.font = "21px sans-serif";
            let by = boxTop + 40;
            for (let sl of setLines) {
              ctx.fillText(sl, 28, by + 20);
              by += setLineH;
            }
          }

          resolve();
        };

        artImg.onload = () => onImageReady(artImg);
        artImg.onerror = () => {
          console.warn("Could not load local image, trying fallback");
          const fallback = new Image();
          fallback.onload = () => onImageReady(fallback);
          fallback.onerror = () => onImageReady(null);
          fallback.src = item.image_url;
        };

        artImg.src = item.local_image || `images/item_${item.id}.png`;
      });
    }

    // Floyd-Steinberg Dithering to Binary Thermal Bytes (With Alpha Safeguard)
    function canvasToThermalRaster(feedLines = 90) {
      const w = canvas.width;
      const h = canvas.height;
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      const gray = new Float32Array(w * h);
      for (let i = 0; i < gray.length; i++) {
        const r = data[i * 4];
        const g = data[i * 4 + 1];
        const b = data[i * 4 + 2];
        const a = data[i * 4 + 3];

        if (a === 0) {
          gray[i] = 255.0; // White paper
        } else {
          const alpha = a / 255.0;
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          gray[i] = lum * alpha + 255.0 * (1.0 - alpha);
        }
      }

      // Floyd-Steinberg error diffusion
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const oldVal = gray[idx];
          const newVal = oldVal > 127 ? 255 : 0;
          gray[idx] = newVal;
          const err = oldVal - newVal;

          if (x + 1 < w) gray[idx + 1] += (err * 7) / 16;
          if (y + 1 < h) {
            if (x - 1 >= 0) gray[(y + 1) * w + (x - 1)] += (err * 3) / 16;
            gray[(y + 1) * w + x] += (err * 5) / 16;
            if (x + 1 < w) gray[(y + 1) * w + (x + 1)] += (err * 1) / 16;
          }
        }
      }

      // Pack into 1-bit bytes (48 bytes per row)
      const totalLines = h + feedLines;
      const raster = new Uint8Array(totalLines * PRINTER_WIDTH_BYTES);

      for (let y = 0; y < h; y++) {
        for (let byteX = 0; byteX < PRINTER_WIDTH_BYTES; byteX++) {
          let byteVal = 0;
          for (let bit = 0; bit < 8; bit++) {
            const px = byteX * 8 + bit;
            if (gray[y * w + px] === 0) {
              byteVal |= (1 << bit);
            }
          }
          raster[y * PRINTER_WIDTH_BYTES + byteX] = byteVal;
        }
      }

      return { raster, totalLines };
    }

    // Print Button (Web Bluetooth)
    btnPrint.addEventListener("click", async () => {
      if (!ctrlChar || !dataChar) {
        alert("Printer is not connected! Please click 'Connect Printer' in the top right corner first.");
        return;
      }

      try {
        btnPrint.disabled = true;
        progressWrap.style.display = "block";
        progressFill.style.width = "0%";

        const { raster, totalLines } = canvasToThermalRaster(90);

        // 1. Initialize (0xB1)
        await ctrlChar.writeValueWithoutResponse(makeCommand(0xB1, [0x00]));
        await new Promise(r => setTimeout(r, 50));

        // 2. Print Request (0xA9)
        await ctrlChar.writeValueWithoutResponse(makeCommand(0xA9, [
          totalLines & 0xFF,
          (totalLines >> 8) & 0xFF,
          PRINTER_WIDTH_BYTES,
          0
        ]));
        await new Promise(r => setTimeout(r, 50));

        // 3. Stream data with paced burn rate
        for (let l = 0; l < totalLines; l++) {
          const offset = l * PRINTER_WIDTH_BYTES;
          const slice1 = raster.subarray(offset, offset + 24);
          const slice2 = raster.subarray(offset + 24, offset + 48);

          await dataChar.writeValueWithoutResponse(slice1);
          await dataChar.writeValueWithoutResponse(slice2);

          await new Promise(r => setTimeout(r, 12));

          if (l % 20 === 0 || l === totalLines - 1) {
            const pct = Math.round((l / totalLines) * 100);
            progressFill.style.width = `${pct}%`;
          }
        }

        // 4. Flush (0xAD)
        await ctrlChar.writeValueWithoutResponse(makeCommand(0xAD, [0x00]));

        // Wait for thermal pins to finish
        const burnWait = Math.max(3000, totalLines * 14);
        await new Promise(r => setTimeout(r, burnWait));

        progressFill.style.width = "100%";
        alert(`Successfully printed "${selectedItem.name}"!`);
      } catch (err) {
        console.error("Print error:", err);
        alert("Failed to print: " + err.message);
      } finally {
        btnPrint.disabled = false;
        progressWrap.style.display = "none";
      }
    });

    // Initialize Grid on page load
    renderGrid("all");
  </script>
</body>
</html>
